<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dota 2 — MMR / Rank / Last 10 (OBS widget)</title>
<style>
/* ============ base ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
:root{
  --bg:#070a10;
  --panel:rgba(18,23,34,.72);
  --panel-2:rgba(10,14,22,.62);
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --txt:#eef2f8;
  --dim:#96a2b8;
  --dim2:#6b778d;
  --win:#2ecc71;
  --win-soft:rgba(46,204,113,.16);
  --loss:#e34a52;
  --loss-soft:rgba(227,74,82,.16);
  --accent:#c73a4a;
  --gold:#e8b64c;
  --radius:18px;
  --pad:18px;
  --fs:16px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
}
body{
  font-family:var(--font);
  font-size:var(--fs);
  color:var(--txt);
  background:var(--bg);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
body[data-bg="transparent"]{background:transparent}
body[data-bg="transparent"] .card{background:var(--panel-2)}

/* ============ card ============ */
.stage{height:100%;display:flex;align-items:stretch;padding:0;overflow:hidden}
.card{
  position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:var(--pad);border-radius:var(--radius);
  background:
    radial-gradient(120% 140% at 0% 0%,rgba(199,58,74,.20),transparent 55%),
    radial-gradient(110% 130% at 100% 100%,rgba(232,182,76,.12),transparent 55%),
    linear-gradient(160deg,rgba(24,30,44,.92),rgba(9,12,19,.94));
  border:1px solid var(--line);
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
}
body[data-bg="transparent"] .card{border-color:var(--line-strong)}
/* top sheen line */
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--gold),transparent);
  opacity:.85;
}
/* moving shimmer — cheap (single transform on a small element) */
.card::after{
  content:"";position:absolute;top:0;left:-40%;width:35%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.055),transparent);
  transform:translateX(0);animation:sheen 9s linear infinite;pointer-events:none;
}
@keyframes sheen{0%{transform:translateX(0)}100%{transform:translateX(400%)}}
@media (prefers-reduced-motion:reduce){.card::after{animation:none;opacity:0}}

/* ============ header row ============ */
.head{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.avatar{
  width:52px;height:52px;border-radius:14px;flex:none;object-fit:cover;
  border:1px solid var(--line-strong);
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  background:#0c1018;
}
.avatar-wrap{position:relative;flex:none}
.avatar-wrap .ring{
  position:absolute;inset:-4px;border-radius:18px;
  border:1px solid rgba(232,182,76,.28);pointer-events:none;
}
.idblock{min-width:0;flex:1}
.name{
  font-size:1.02rem;font-weight:650;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name .tag{
  font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);margin-left:8px;vertical-align:2px;
}
.rankline{display:flex;align-items:center;gap:8px;margin-top:3px;min-width:0}
.rankname{
  font-size:.86rem;font-weight:600;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rankname b{color:var(--txt);font-weight:700}
.divpips{display:flex;gap:3px;flex:none}
.pip{width:6px;height:6px;transform:rotate(45deg);border-radius:1.5px;background:rgba(255,255,255,.16)}
.pip.on{background:linear-gradient(160deg,var(--gold),#c98b25);box-shadow:0 0 6px rgba(232,182,76,.55)}

/* medal */
.medal{position:relative;width:74px;height:74px;flex:none;display:grid;place-items:center}
.medal .glow{
  position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle,var(--league,#c73a4a) 0%,transparent 68%);
  opacity:.30;filter:blur(2px);
}
.medal img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.medal .board{
  position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.02em;
  background:rgba(6,8,12,.86);border:1px solid var(--line-strong);border-radius:6px;
  padding:1px 5px;color:var(--gold);white-space:nowrap;
}
/* css fallback medal */
.medal .fallback{
  position:relative;width:60px;height:66px;display:none;place-items:center;
  clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%);
  background:linear-gradient(160deg,var(--league,#c73a4a),#0b0f16);
  border:1px solid rgba(255,255,255,.18);
}
.medal .fallback span{font-family:var(--mono);font-size:1.35rem;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}
.medal.noimg img{display:none}
.medal.noimg .fallback{display:grid}

/* mmr */
.mmrbox{text-align:right;flex:none;position:relative;padding-left:14px}
.mmrbox::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.mmrlabel{
  font-size:.6rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);
}
.mmr{
  font-family:var(--mono);font-weight:700;font-size:2.05rem;line-height:1.05;
  letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff,#c9d4e6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 18px rgba(120,160,220,.10);
  white-space:nowrap;
}
.mmr .approx{font-size:.9rem;opacity:.55;vertical-align:.55em;margin-left:1px}
.delta{font-family:var(--mono);font-size:.72rem;font-weight:700;margin-top:2px;display:flex;gap:6px;justify-content:flex-end;align-items:center;color:var(--dim2)}
.delta .up{color:var(--win)}.delta .down{color:var(--loss)}.delta .flat{color:var(--dim2)}

/* ============ matches row ============ */
.body{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px}
.rowlabel{
  display:flex;align-items:center;gap:10px;font-size:.6rem;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);
}
.rowlabel .line{flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:7px;align-items:stretch}
.chip{
  position:relative;flex:1 1 0;min-width:0;height:40px;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  border:1px solid var(--line-strong);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  overflow:hidden;
}
.chip .letter{
  font-family:var(--mono);font-weight:800;font-size:1.02rem;line-height:1;letter-spacing:.02em;
}
.chip .hero{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;filter:saturate(.9);
}
.chip .kda{font-family:var(--mono);font-size:.56rem;color:rgba(255,255,255,.62);margin-top:2px;white-space:nowrap}
.chip.w{border-color:rgba(46,204,113,.5);background:linear-gradient(180deg,var(--win-soft),rgba(46,204,113,.04))}
.chip.w .letter{color:#8ff0bb;text-shadow:0 0 12px rgba(46,204,113,.55)}
.chip.l{border-color:rgba(227,74,82,.5);background:linear-gradient(180deg,var(--loss-soft),rgba(227,74,82,.04))}
.chip.l .letter{color:#ffb3b6;text-shadow:0 0 12px rgba(227,74,82,.5)}
.chip.empty{border-style:dashed;border-color:rgba(255,255,255,.10);background:none}
.chip.empty .letter{color:var(--dim2);font-size:.8rem}
.chip.newest{box-shadow:0 0 0 1px rgba(232,182,76,.35),0 0 16px rgba(232,182,76,.16)}
.chip .dot{position:absolute;top:4px;right:5px;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.85}

.summary{display:flex;align-items:center;gap:14px;font-size:.74rem;color:var(--dim);font-family:var(--mono)}
.summary .wr{color:var(--txt);font-weight:700}
.summary .sep{width:1px;height:12px;background:var(--line-strong)}
.summary .streak-hot{color:var(--gold)}

/* ============ footer ============ */
.foot{
  display:flex;align-items:center;gap:8px;font-size:.66rem;color:var(--dim2);
  font-family:var(--mono);position:relative;z-index:1;
}
.foot .status{display:flex;align-items:center;gap:6px}
.live{width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 0 0 rgba(46,204,113,.55);animation:pulse 2.4s ease-out infinite}
.live.stale{background:var(--gold)}
.live.err{background:var(--loss)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}70%{box-shadow:0 0 0 7px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
.foot .spacer{flex:1}
.foot a{color:var(--dim2);text-decoration:none}

/* ============ states ============ */
.skeleton{position:relative;z-index:1}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));
  background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:8px}
@keyframes sk{0%{background-position:120% 0}100%{background-position:-80% 0}}
.notice{
  position:relative;z-index:1;display:flex;align-items:center;gap:10px;
  font-size:.78rem;color:var(--dim);
}
.notice .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:rgba(227,74,82,.16);border:1px solid rgba(227,74,82,.4);color:#ffb3b6;font-weight:800;font-size:.8rem}
.notice.warn .ico{background:rgba(232,182,76,.14);border-color:rgba(232,182,76,.4);color:var(--gold)}
.hidden{display:none!important}

/* ============ narrow / OBS-small layouts ============ */
@media (max-width:470px){
  :root{--pad:14px;--radius:14px}
  .head{flex-wrap:wrap;gap:10px}
  .idblock{flex:1 1 auto;order:2}
  .medal{width:58px;height:58px;order:1}
  .avatar{width:44px;height:44px;border-radius:12px}
  .mmrbox{order:3;width:100%;text-align:left;padding-left:0;display:flex;align-items:baseline;gap:10px}
  .mmrbox::before{display:none}
  .mmr{font-size:1.7rem}
  .delta{margin-left:auto}
  .mmrlabel{display:none}
  .chips{flex-wrap:wrap;gap:6px}
  .chip{flex:0 0 calc(20% - 5px);height:36px}
  .summary{flex-wrap:wrap;gap:8px}
}
@media (max-height:190px){
  :root{--pad:12px;--radius:14px}
  .card{gap:8px}
  .rowlabel{display:none}
  .foot{font-size:.6rem}
}
@media (max-height:150px){
  :root{--pad:10px}
  .card{gap:6px}
  .foot{display:none}
  .avatar{width:40px;height:40px}
  .medal{width:48px;height:48px}
  .chip{height:32px}
}

/* ============ settings (hover-only → invisible in OBS) ============ */
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .w{background:linear-gradient(90deg,#2ecc71,#59e08f)}
.bar .l{background:linear-gradient(90deg,#e34a52,#b53038)}
.gear{
  position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:9px;z-index:5;
  display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .18s ease,background .18s;
  background:rgba(10,14,22,.7);border:1px solid var(--line);color:var(--dim);font-size:15px;
}
body:hover .gear{opacity:.9}
.gear:hover{background:rgba(20,26,38,.95);color:var(--txt)}
.panel{
  position:absolute;inset:0;z-index:9;background:rgba(6,9,14,.97);backdrop-filter:blur(6px);
  padding:14px 16px;overflow:auto;font-size:.78rem;
}
.panel h3{margin:0 0 10px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.f label{color:var(--dim);font-size:.64rem;letter-spacing:.04em}
.f input,.f select{
  background:#0d1220;border:1px solid var(--line-strong);color:var(--txt);border-radius:7px;
  padding:6px 8px;font:inherit;font-size:.74rem;outline:none;
}
.f input:focus,.f select:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
details{border:1px solid var(--line);border-radius:9px;padding:8px 9px 2px;margin:4px 0 10px}
details summary{cursor:pointer;color:var(--dim);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.cbs{display:flex;flex-wrap:wrap;gap:6px 12px;margin:2px 0 8px}
.cbs label{display:flex;align-items:center;gap:6px;color:var(--dim);cursor:pointer;font-size:.74rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
button.b{
  background:linear-gradient(180deg,#c73a4a,#8e2634);border:1px solid rgba(255,255,255,.18);color:#fff;
  padding:8px 14px;border-radius:9px;font:inherit;font-size:.76rem;font-weight:600;cursor:pointer;
}
button.b.ghost{background:#141a28;color:var(--dim)}
button.b:hover{filter:brightness(1.1)}
.hint{color:var(--dim2);font-size:.68rem;line-height:1.5;margin:8px 0 0}
.hint code{font-family:var(--mono);color:var(--gold);background:rgba(255,255,255,.06);padding:1px 4px;border-radius:4px}
.urlbox{font-family:var(--mono);font-size:.66rem;color:var(--dim);background:#0b0f18;border:1px solid var(--line);
  border-radius:8px;padding:8px;word-break:break-all;margin-top:8px}
.hint.warn{color:var(--gold)}
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:#0c1119}
.res:hover{border-color:var(--accent)}
.res img{width:28px;height:28px;border-radius:6px}
.res .n{font-size:.74rem;color:var(--txt)}
.res .i{font-size:.64rem;color:var(--dim2);font-family:var(--mono)}
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="card">
    <!-- LOADING -->
    <div class="skeleton" id="skeleton" style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;gap:14px;align-items:center">
        <div class="sk" style="width:52px;height:52px;border-radius:14px"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:8px">
          <div class="sk" style="height:14px;width:55%"></div>
          <div class="sk" style="height:11px;width:35%"></div>
        </div>
        <div class="sk" style="height:36px;width:120px"></div>
      </div>
      <div class="sk" style="height:40px;width:100%"></div>
    </div>

    <!-- CONTENT -->
    <div id="content" class="hidden" style="display:flex;flex-direction:column;gap:14px">
      <div class="head">
        <div class="avatar-wrap" id="avatarWrap">
          <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer">
          <div class="ring"></div>
        </div>
        <div class="medal" id="medal">
          <div class="glow"></div>
          <img id="medalImg" alt="">
          <div class="fallback"><span id="fbText">?</span></div>
          <div class="board hidden" id="board"></div>
        </div>
        <div class="idblock">
          <div class="name" id="name">—<span class="tag" id="tag"></span></div>
          <div class="rankline">
            <div class="rankname" id="rankname"></div>
            <div class="divpips" id="pips"></div>
          </div>
        </div>
        <div class="mmrbox">
          <div class="mmrlabel" id="mmrlabel">MMR</div>
          <div class="mmr" id="mmr">—</div>
          <div class="delta" id="delta"></div>
        </div>
      </div>

      <div class="body">
        <div class="rowlabel"><span id="matchesLabel">Последние 10 игр</span><span class="line"></span></div>
        <div class="chips" id="chips"></div>
        <div class="bar" id="bar"></div>
        <div class="summary" id="summary"></div>
      </div>

      <div class="foot">
        <span class="status"><span class="live" id="live"></span><span id="updated">—</span></span>
        <span class="spacer"></span>
        <span id="countdown"></span>
      </div>
    </div>

    <!-- ERROR -->
    <div id="error" class="notice hidden">
      <span class="ico">!</span><span id="errorMsg"></span>
    </div>

    <div class="gear" id="gear" title="Настройки виджета">⚙</div>
    <div class="panel hidden" id="panel"></div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Dota 2 OBS widget — OpenDota (Steam) data, auto-refresh, W/L of last N
   ========================================================================= */

const OD = "https://api.opendota.com";
const CDN = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react";
const RANK_ICON = "https://www.opendota.com/assets/images/dota2/rank_icons";
const STORE = "dota2obswidget.v1";
const STEAM_BASE = 76561197960265728n;

const RANK_NAMES = {
  en: ["Uncalibrated","Herald","Guardian","Crusader","Archon","Legend","Ancient","Divine","Immortal"],
  ru: ["Без ранга","Рекрут","Страж","Рыцарь","Герой","Легенда","Властелин","Божество","Титан"]
};
const LEAGUE_COLOR = ["#6b778d","#5c8f7a","#5a8fb0","#8a6fb5","#4f9aa8","#c9a227","#4fae7a","#d05a6a","#e2793c"];
const GAME_MODE_RU = {1:"All Pick",2:"Captains Mode",22:"All Draft",23:"Turbo",24:"Mutation",6:"Single Draft",16:"Captains Draft"};
const RANKED_MODES = new Set([1,2,22,23]);
const T = {
  ru:{last:"Последние %n игр", mmr:"MMR", upd:"обновлено %t", next:"след. через %t", none:"нет матчей",
      win:"W", loss:"L", streak:"серия", loading:"обновление…", noacct:"Укажите Steam ID / ник: наведите мышь на виджет и нажмите ⚙",
      priv:"Профиль закрыт или игрок не найден. Сделайте профиль Steam публичным и подождите обновления.",
      net:"Нет связи с OpenDota. Показаны последние сохранённые данные.",
      uncal:"калибровка", turbo:"Turbo", board:"глобальный", ago:"назад", now:"только что",
      min:"м", hour:"ч", day:"д", sec:"с"},
  en:{last:"Last %n games", mmr:"MMR", upd:"updated %t", next:"next in %t", none:"no matches",
      win:"W", loss:"L", streak:"streak", loading:"refreshing…", noacct:"Set your Steam ID / nickname: hover the widget and click ⚙",
      priv:"Profile private or player not found. Make your Steam profile public and wait for an update.",
      net:"Cannot reach OpenDota. Showing last cached data.",
      uncal:"uncalibrated", turbo:"Turbo", board:"global", ago:"ago", now:"just now",
      min:"m", hour:"h", day:"d", sec:"s"}
};

/* ---------- params: URL query overrides localStorage ---------- */
const q = new URLSearchParams(location.search);
const saved = (()=>{ try{return JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){return {}} })();
const cfg = Object.assign({
  id:"",                 // steamid64 / account32 / vanity / nickname
  account:"",            // resolved 32-bit id
  accountFrom:"",        // the id string that produced `account`
  refresh:30,            // minutes
  matches:10,            // how many W/L chips
  lang:"ru",
  bg:"dark",             // dark | transparent
  modes:"all",           // all | ranked | ranked_no_turbo
  accent:"",
  size:1,                // scale factor
  proxy:"",              // optional prefix, e.g. "https://corsproxy.io/?"
  showAvatar:1, showHero:1, showKda:1, showDelta:1, showCountdown:1, showApprox:1, showSummary:1,
  showMmr:1, bar:1, hideGear:0, mock:0, noimg:0,
  newest:1,
  names:""               // custom rank names, comma separated
}, saved);
for (const [k,v] of q) {
  const key = ({accountid:"id",steamid:"id",player:"id",steam:"id"})[k] || k;
  if (key in cfg) cfg[key] = v;
}
for (const k of ["refresh","matches","size","showAvatar","showHero","showKda","showDelta","showCountdown",
                 "showApprox","showSummary","showMmr","bar","hideGear","newest"]) {
  cfg[k] = parseFloat(cfg[k]);
  if (!isFinite(cfg[k])) cfg[k] = 0;
}
cfg.refresh = Math.max(1, cfg.refresh || 30);
cfg.matches = Math.min(20, Math.max(1, cfg.matches || 10));
const L = T[cfg.lang] ? cfg.lang : "ru";
const NAMES = (cfg.names ? String(cfg.names).split(",").map(s=>s.trim()) : RANK_NAMES[L]).filter(Boolean);
const rankName = (league) => NAMES[league] || RANK_NAMES.en[league] || "?";

/* ---------- helpers ---------- */
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtInt = (n)=>Math.round(n).toLocaleString(L==="ru"?"ru-RU":"en-US");
const roman = ["","I","II","III","IV","V","VI","VII"];
function agoText(ts){
  const s = Math.max(0, (Date.now()/1000) - ts);
  if (s < 45) return T[L].now;
  const m = s/60;
  if (m < 60) return Math.round(m)+T[L].min+" "+T[L].ago;
  const h = m/60;
  if (h < 24) return Math.round(h)+T[L].hour+" "+T[L].ago;
  return Math.round(h/24)+T[L].day+" "+T[L].ago;
}
function durText(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m+":"+String(s).padStart(2,"0");
}
function vanityToken(s){
  const m = s.match(/(?:steamcommunity\.com)?\/(?:id|profiles|memberprofile\/member)\/([0-9a-zA-Z_-]+)/i);
  return m ? m[1] : s;
}
function toAccount32(input){
  const s = String(input||"").trim();
  if (!s) return "";
  const tok = vanityToken(s);
  if (/^765\d{14}$/.test(tok)) return String(BigInt(tok) - STEAM_BASE);
  if (/^\d+$/.test(tok) && tok.length <= 11) return tok;
  return "";
}
async function fetchJSON(path, opts={}){
  let url = OD + path;
  if (cfg.proxy) url = cfg.proxy + encodeURIComponent(url);
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), opts.timeout || 20000);
  try {
    const r = await fetch(url, Object.assign({headers:{}, cache:"no-store", signal:ctl.signal}, opts));
    if (!r.ok) { const e = new Error("HTTP "+r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(to); }
}

/* hero id -> {slug, name}; cached for a day, never blocks the main render */
let HEROES = null;
const HERO_KEY = STORE + ".heroes";
function loadHeroesCache(){
  try{
    const h = JSON.parse(localStorage.getItem(HERO_KEY)||"null");
    if (h && h.t > Date.now()/1000 - 86400*3) { HEROES = h.map; return true; }
  }catch(e){}
  return false;
}
function ensureHeroes(){
  if (HEROES) return;
  if (loadHeroesCache()) { if (ui.lastData) renderMatches(ui.lastData); return; }
  fetchJSON("/api/heroes", {timeout:25000}).then(list=>{
    const map = {};
    list.forEach(x=>{ map[x.id] = {slug:String(x.name||"").replace(/^npc_dota_hero_/,""), name:x.localized_name}; });
    HEROES = map;
    try{ localStorage.setItem(HERO_KEY, JSON.stringify({t:Date.now()/1000, map})); }catch(e){}
    if (ui.lastData) renderMatches(ui.lastData);
  }).catch(()=>{});
}

/* ---------- rank tier math (OpenDota/Valve: league=floor(tier/10), div=tier%10) ---------- */
function rankInfo(tier, leaderboardRank){
  const t = parseInt(tier,10);
  if (!t) return {league:0, div:0, icon:0, star:0, name:rankName(0), immortal:false};
  const league = Math.min(8, Math.floor(t/10));
  const div = t % 10;
  const immortal = league === 8;
  let icon = String(league);
  if (immortal && leaderboardRank) icon = leaderboardRank <= 10 ? "8c" : (leaderboardRank <= 100 ? "8b" : "8");
  return {league, div, icon, star: Math.min(7, Math.max(1, div||1)), name:rankName(league), immortal};
}

function renderDelta(mmr){
  const el = $("delta");
  if (!cfg.showDelta || !mmr) { el.innerHTML = ""; return; }
  const hist = (state.mmrHistory||[]).filter(h=>h.mmr);
  const prev = hist.length>1 ? hist[hist.length-2].mmr : null;
  const day = hist.filter(h=>h.t > Date.now()/1000 - 86400)[0];
  const parts = [];
  if (prev != null) {
    const d = Math.round(mmr - prev);
    const cls = d>0?"up":(d<0?"down":"flat");
    const ar = d>0?"▲":(d<0?"▼":"■");
    parts.push('<span class="'+cls+'">'+ar+" "+(d>0?"+":"")+d+"</span>");
  }
  if (day && Math.abs(mmr-day.mmr)>0.5 && day !== (hist[hist.length-1])) {
    const d = Math.round(mmr - day.mmr);
    parts.push('<span class="'+(d>0?"up":"down")+'" title="за сутки">24ч '+(d>0?"+":"")+d+"</span>");
  }
  el.innerHTML = parts.join("");
}

function heroInfo(id){ return (HEROES && HEROES[id]) || null; }

function pickMatches(d){
  const list = (d.matches||[]).slice();
  if (cfg.modes === "ranked") return list.filter(m=>RANKED_MODES.has(m.game_mode));
  if (cfg.modes === "ranked_no_turbo") return list.filter(m=>m.game_mode!==23);
  if (cfg.modes === "turbo") return list.filter(m=>m.game_mode===23);
  return list;
}

const isWin = (m)=> (m.player_slot < 128) === !!m.radiant_win;

function renderMatches(d){
  $("matchesLabel").textContent = T[L].last.replace("%n", cfg.matches);
  const list = pickMatches(d).slice(0, cfg.matches);          // newest first
  const slots = list.slice().reverse();                         // oldest → newest
  while (slots.length < cfg.matches) slots.unshift(null);
  const chips = $("chips");
  chips.innerHTML = "";
  let w=0,l=0;
  slots.forEach((m, i)=>{
    const div = document.createElement("div");
    if (!m){ div.className = "chip empty"; div.innerHTML = '<span class="letter">·</span>'; chips.appendChild(div); return; }
    const win = isWin(m);
    win ? w++ : l++;
    div.className = "chip " + (win ? "w" : "l") + (cfg.newest && i === slots.length-1 ? " newest" : "");
    const hi = cfg.noimg ? null : heroInfo(m.hero_id);
    let inner = "";
    if (cfg.showHero && hi && hi.slug) inner += '<img class="hero" src="'+esc(CDN+"/heroes/"+hi.slug+".png")+'" alt="" referrerpolicy="no-referrer" onerror="this.remove()">';
    inner += '<span class="letter">'+(win?"W":"L")+"</span>";
    if (cfg.showKda && m.kills!=null) inner += '<span class="kda">'+m.kills+"/"+m.deaths+"/"+m.assists+"</span>";
    if (cfg.newest && i === slots.length-1) inner += '<span class="dot"></span>';
    div.innerHTML = inner;
    div.title = [ hi ? hi.name : "", win ? (L==="ru"?"Победа":"Win") : (L==="ru"?"Поражение":"Loss"),
                  m.kills!=null ? (m.kills+"/"+m.deaths+"/"+m.assists) : "",
                  m.duration ? Math.round(m.duration/60)+" мин" : "",
                  GAME_MODE_RU[m.game_mode]||"", m.start_time ? agoText(m.start_time) : "" ]
                  .filter(Boolean).join(" · ");
    chips.appendChild(div);
  });
  const sum = $("summary");
  if (!cfg.showSummary) { sum.innerHTML=""; sum.style.display="none"; return; }
  sum.style.display="";
  const total = w+l, wr = total ? Math.round(w/total*100) : 0;
  let streak=0, dir=null;
  for (let i=slots.length-1;i>=0;i--){
    const m=slots[i]; if(!m) break;
    const win = isWin(m);
    if (dir===null){dir=win;streak=1} else if (win===dir) streak++; else break;
  }
  sum.innerHTML = total
    ? '<span class="wr">'+wr+'%</span><span>'+w+T[L].win+" / "+l+T[L].loss+"</span>"+
      (streak>=2?'<span class="sep"></span><span class="streak-hot">'+T[L].streak+" "+(dir?"W":"L")+"×"+streak+"</span>":"")
    : '<span>'+T[L].none+"</span>";
  const bar = $("bar");
  if (cfg.bar && total) {
    bar.style.display="";
    bar.innerHTML = '<i class="w" style="flex:'+w+'"></i><i class="l" style="flex:'+l+'"></i>';
  } else bar.style.display="none";
}

function renderFoot(d, at, err){
  const stale = Date.now()/1000 - at > cfg.refresh*60*1.6;
  const live = $("live");
  live.className = "live" + (err==="pending" ? " stale" : err ? " err" : stale ? " stale" : "");
  let txt = T[L].upd.replace("%t", at ? agoText(at) : "—");
  if (err==="pending") txt += " · "+T[L].loading;
  else if (err) txt = "⚠ "+T[L].net;
  $("updated").textContent = txt;
  $("countdown").style.display = cfg.showCountdown ? "" : "none";
}

function render(data, at, err){
  ui = {lastData:data, lastAt:at, error:err==="pending"?null:err, footState:err||null};
  if (!data) {
    $("skeleton").style.display = err==="noacct" || err==="priv" ? "none" : "flex";
    $("content").classList.add("hidden");
    const e = $("error");
    e.className = "notice" + (err==="net" ? " warn" : "");
    e.classList.remove("hidden");
    $("errorMsg").textContent = err==="priv"||err==="noacct" ? T[L][err==="priv"?"priv":"noacct"] : T[L].net;
    return;
  }
  $("skeleton").style.display = "none";
  $("error").classList.add("hidden");
  $("content").classList.remove("hidden");
  renderHead(data);
  renderMatches(data);
  renderFoot(data, at, err);
}

/* ---------- data ---------- */
async function resolveAccount(input){
  const direct = toAccount32(input);
  if (direct) return direct;
  const term = vanityToken(String(input||"").trim());
  const res = await fetchJSON("/api/search?q="+encodeURIComponent(term));
  if (!Array.isArray(res) || !res.length) { const e=new Error("not found"); e.kind="priv"; throw e; }
  return String(res[0].account_id);
}
function setAccount(id, from){
  cfg.account = String(id||""); cfg.accountFrom = from;
  saveCfg(); state = store.read();
}

async function loadPlayer(account){
  const [prof, matches] = await Promise.all([
    fetchJSON("/api/players/"+account),
    fetchJSON("/api/players/"+account+"/recentMatches")
  ]);
  if (prof && prof.profile && prof.profile.fh_unavailable) { const e=new Error("private"); e.kind="priv"; throw e; }
  return { profile: prof.profile || {}, rank_tier: prof.rank_tier, leaderboard_rank: prof.leaderboard_rank,
           computed_mmr: prof.computed_mmr, computed_mmr_turbo: prof.computed_mmr_turbo, matches: matches||[] };
}

let nextAt = 0, timer = null, inflight = null, fails = 0;
function refresh(force){
  if (!cfg.account) { render(null, 0, "noacct"); nextAt = 0; return Promise.resolve(); }
  if (inflight) return inflight;
  inflight = (async ()=>{
    try {
      const data = cfg.mock ? mockData() : await loadPlayer(cfg.account);
      const at = Date.now()/1000;
      state.cache = {data, at};
      const mmr = data.computed_mmr;
      if (mmr) {
        state.mmrHistory = state.mmrHistory || [];
        const last = state.mmrHistory[state.mmrHistory.length-1];
        if (!last || at - last.t > 60) state.mmrHistory.push({t:at, mmr});
        state.mmrHistory = state.mmrHistory.slice(-400);
      }
      store.write(state);
      ui.error = null; fails = 0;
      render(data, at);
      nextAt = at + cfg.refresh*60;
    } catch(e){
      const kind = e.kind || (e.status===404?"priv":(e.status===429?"rate":"net"));
      ui.error = kind; fails++;
      if (state.cache && state.cache.data) render(state.cache.data, state.cache.at, kind);
      else render(null, 0, kind);
      nextAt = Date.now()/1000 + (kind==="priv" ? cfg.refresh*60 : Math.min(900, 20*Math.pow(1.7, Math.min(5,fails))));
    } finally { inflight = null; }
  })();
  return inflight;
}

function tick(){
  const now = Date.now()/1000;
  if (nextAt && now >= nextAt) { nextAt = 0; refresh(true); }
  if (cfg.showCountdown && nextAt && $("countdown")) $("countdown").textContent = T[L].next.replace("%t", durText(nextAt-now));
  else if ($("countdown")) $("countdown").textContent = "";
  if (ui.lastData) renderFoot(ui.lastData, ui.lastAt, ui.footState);
}

/* ---------- settings panel ---------- */
function paramsFrom(o){
  const keys = ["id","account","accountFrom","refresh","matches","lang","bg","modes","accent","size","proxy","mock","noimg",
    "showAvatar","showHero","showKda","showDelta","showCountdown","showApprox","showSummary","showMmr","bar","hideGear","newest","names"];
  const p = new URLSearchParams();
  keys.forEach(k=>{ if (o[k]==="" || o[k]==null) return; if ((k==="mock"||k==="noimg") && !+o[k]) return; p.set(k, o[k]); });
  return p;
}
function buildURL(o){ return location.origin + location.pathname + "?" + paramsFrom(o||cfg).toString(); }

/* read the settings form into a config object */
function readForm(el){
  const o = Object.assign({}, cfg);
  o.id = el.querySelector("#p-id").value.trim();
  o.refresh = Math.max(1, parseFloat(el.querySelector("#p-refresh").value)||30);
  o.matches = Math.min(20, Math.max(1, parseInt(el.querySelector("#p-matches").value)||10));
  o.lang = el.querySelector("#p-lang").value;
  o.modes = el.querySelector("#p-modes").value;
  o.bg = el.querySelector("#p-bg").value;
  o.size = Math.min(3, Math.max(.5, parseFloat(el.querySelector("#p-size").value)||1));
  o.names = el.querySelector("#p-names").value.trim();
  o.proxy = el.querySelector("#p-proxy").value.trim();
  o.accent = el.querySelector("#p-accent").value.trim();
  el.querySelectorAll("input[type=checkbox]").forEach(c=>o[c.dataset.k] = c.checked?1:0);
  if (!o.id) { o.account = ""; o.accountFrom = ""; }
  else if (o.accountFrom !== o.id) { o.account = ""; o.accountFrom = ""; }   // will be re-resolved on load
  return o;
}

    const res = await searchPlayers(el.querySelector("#p-id").value);
    box.innerHTML = res.map(r=>`<div class="res" data-a="${r.account_id}">
      <img src="${esc(r.avatarfull||"")}" onerror="this.style.visibility='hidden'">
      <div><div class="n">${esc(r.personaname||"")}</div><div class="i">${r.account_id}</div></div></div>`).join("")
      || "<div class='i'>не найдено</div>";
    box.querySelectorAll(".res").forEach(n=>n.onclick=()=>{
      setAccount(n.dataset.a, el.querySelector("#p-id").value.trim()); showURL(); refresh(true);
    });
  };
  el.querySelector("#p-save").onclick = ()=>{
    Object.assign(cfg, readForm(el));
    saveCfg();
    el.classList.add("hidden");
    location.reload();
  };
}

async function searchPlayers(input){
  const direct = toAccount32(input);
  if (direct) { try{ const p = await fetchJSON("/api/players/"+direct); return [{account_id:direct, personaname:(p.profile||{}).personaname, avatarfull:(p.profile||{}).avatarfull}]; }catch(e){ return []; } }
  try { return await fetchJSON("/api/search?q="+encodeURIComponent(vanityToken(input||""))); } catch(e){ return []; }
}
function saveCfg(){
  const clean = {};
  Object.keys(cfg).forEach(k=>{ if (cfg[k]!=="" && cfg[k]!=null) clean[k]=cfg[k]; });
  try{ localStorage.setItem(STORE, JSON.stringify(clean)); }catch(e){}
}

/* ---------- boot ---------- */
setAccent();
if (cfg.hideGear) $("gear").style.display = "none";
$("gear").onclick = ()=> $("panel").classList.contains("hidden") ? openPanel() : $("panel").classList.add("hidden");
document.addEventListener("keydown", e=>{ if (e.key==="Escape") $("panel").classList.add("hidden"); });

(async function boot(){
  if (cfg.mock) {
    HEROES = MOCK_HEROES;
    cfg.account = cfg.account || "mock";
    state = {mmrHistory:[{t:Date.now()/1000-7200, mmr:4108}, {t:Date.now()/1000-1800, mmr:4115}]};
    await refresh(true); tick(); timer = setInterval(tick, 1000); return;
  }
  if (!cfg.noimg) ensureHeroes();
  // (re)resolve whenever the requested id differs from what produced the cached account
  if (cfg.id && (!cfg.account || cfg.accountFrom !== cfg.id)) {
    try { setAccount(await resolveAccount(cfg.id), cfg.id); }
    catch(e){ render(null, 0, e.kind || "priv"); return; }
  }
  if (!cfg.account) { render(null, 0, "noacct"); return; }
  state = store.read();
  if (state.cache && state.cache.data) { render(state.cache.data, state.cache.at, "pending"); nextAt = 0; }
  await refresh(true);
  tick();
  timer = setInterval(tick, 1000);
})();

document.addEventListener("visibilitychange", ()=>{
  if (!document.hidden && nextAt && Date.now()/1000 >= nextAt) refresh(true);
});
window.addEventListener("focus", ()=>{
  if (Date.now()/1000 - (ui.lastAt||0) > cfg.refresh*60) refresh(true);
});
</script>
</body>
